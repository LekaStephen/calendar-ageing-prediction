[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-ageing-prediction"
version = "0.1.0"
description = "Li-ion battery calendar-ageing research demonstrator"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.38,<2", "pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "openpyxl>=3.1,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
